name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/android/**'
      - 'deps/**'
      - 'scripts/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-36
            platforms;android-35
            build-tools;36.0.0
            cmake;3.22.1

      - name: Install NDK r28
        run: |
          echo "y" | sdkmanager "ndk;28.0.12433566"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12433566" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.12433566" >> "$GITHUB_ENV"

      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libtalloc-dev talloc-dev || true
          sudo apt-get install -y -qq ar zstd

      - name: Prepare provider customization
        run: |
          cp src/android/app/provider-customization.properties.example \
             src/android/app/provider-customization.properties

      - name: Build PRoot (native sandbox)
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x deps/build_proot.sh
          ./deps/build_proot.sh

      - name: Prepare Android sandbox (Alpine rootfs)
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x scripts/prepare_android_sandbox.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Verify sandbox assets
        run: |
          echo "=== assets ==="
          ls -lh src/android/app/src/main/assets/ || true
          echo "=== jniLibs ==="
          ls -lhR src/android/app/src/main/jniLibs/ || true

      - name: Build debug APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -Pandroid.native.buildOutput=verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openminis-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          compression-level: 0