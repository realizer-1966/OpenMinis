name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/android/**'
      - 'deps/**'
      - 'scripts/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          # Ubuntu runner has Android SDK preinstalled; check what's available
          echo "=== Preinstalled SDK platforms ==="
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || true
          echo "=== Preinstalled NDK ==="
          ls "$ANDROID_HOME/ndk/" 2>/dev/null || true
          echo "=== Preinstalled build-tools ==="
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || true
          echo "=== Preinstalled cmake ==="
          ls "$ANDROID_HOME/cmake/" 2>/dev/null || true

          # Install platform android-36 if not present
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            echo "Installing platforms;android-36..."
            yes | sdkmanager "platforms;android-36" 2>&1 || true
          fi

          # Install build-tools 36.0.0 if not present
          if [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "Installing build-tools;36.0.0..."
            yes | sdkmanager "build-tools;36.0.0" 2>&1 || true
          fi

          # Install cmake 3.22.1 if not present
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            echo "Installing cmake;3.22.1..."
            yes | sdkmanager "cmake;3.22.1" 2>&1 || true
          fi

          # Install NDK r28 if not present
          if [ ! -d "$ANDROID_HOME/ndk/28.0.12433566" ]; then
            echo "Installing NDK r28..."
            yes | sdkmanager "ndk;28.0.12433566" 2>&1 || true
          fi

          # Set NDK home
          NDK_HOME=$(ls -d "$ANDROID_HOME/ndk/"* 2>/dev/null | sort -V | tail -1)
          echo "NDK_HOME=$NDK_HOME"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_HOME" >> "$GITHUB_ENV"

          echo "=== Final SDK state ==="
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || true
          ls "$ANDROID_HOME/ndk/" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || true

      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libtalloc-dev || true
          which ar || sudo apt-get install -y -qq binutils
          which zstd || sudo apt-get install -y -qq zstd

      - name: Prepare debug skill assets
        run: |
          # The .claude/skills/debug-server/ directory is not in the public
          # mirror (it lives in the private dev tree). Create a stub so Gradle's
          # stageDebugSkillAssets task doesn't fail on missing input dir.
          mkdir -p .claude/skills/debug-server/examples
          if [ ! -f .claude/skills/debug-server/SKILL.md ]; then
            printf '# debug-server skill unavailable\n\nSKILL.md was not found at build time.\n' \
              > .claude/skills/debug-server/SKILL.md
          fi

      - name: Prepare provider customization
        run: |
          cp src/android/app/provider-customization.properties.example \
             src/android/app/provider-customization.properties

      - name: Build PRoot (native sandbox)
        run: |
          chmod +x deps/build_proot.sh
          ./deps/build_proot.sh

      - name: Prepare Android sandbox (Alpine rootfs)
        run: |
          chmod +x scripts/prepare_android_sandbox.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Verify sandbox assets
        run: |
          echo "=== assets ==="
          ls -lh src/android/app/src/main/assets/ || true
          echo "=== jniLibs ==="
          ls -lhR src/android/app/src/main/jniLibs/ || true

      - name: Build debug APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -Pandroid.native.buildOutput=verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openminis-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          compression-level: 0